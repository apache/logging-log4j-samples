version: 2

# Add Maven Central explicitly to work around:
#   https://github.com/dependabot/dependabot-core/issues/8329
registries:
  maven-central:
    type: maven-repository
    url: https://repo.maven.apache.org/maven2

updates:
  - package-ecosystem: maven
    directories:
      - "/"
      - "log4j-samples-graalvm"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      maven-minor-updates:
        update-types:
          - "minor"
          - "patch"
    registries:
      - maven-central
    ignore:
      - dependency-name: "org.apache.logging.log4j:*"
        versions: ["[3.0.0-alpha1,)"]
      # `org.springframework.boot:spring-boot-dependencies:4.x` is the Spring Boot 4 generation.
      # `log4j-spring-cloud-config-sample-application` depends on
      # `org.apache.logging.log4j:log4j-spring-cloud-config-client:2.26.1`, which is built against
      # `org.springframework.cloud:spring-cloud-context:4.3.0` — Spring Boot 3.
      - dependency-name: "org.springframework.boot:*"
        versions: ["[4,)"]
      # `org.springframework.cloud:spring-cloud-dependencies:2025.1.3` is the Spring Boot 4 release
      # train, paired with `spring-boot-dependencies:4.x`. It resolves
      # `org.springframework.cloud:spring-cloud-starter-bus-amqp:5.0.3`, which needs
      # `org.springframework.amqp:spring-rabbit:4.0.5` while `spring-boot-dependencies:3.5.7`
      # manages that down to `3.2.8`, so `enforce-upper-bound-deps` fails.
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        versions: ["[2025.1,)"]

  - package-ecosystem: gradle
    directories:
      - "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle-minor-updates:
        update-types:
          - "minor"
          - "patch"
    registries:
      - maven-central
    ignore:
      - dependency-name: "org.apache.logging.log4j:*"
        versions: ["[3.0.0-alpha1,)"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # `actions/*` are pinned to major version tags, so only major updates are relevant.
    # Other actions are pinned by hash and receive all updates.
    ignore:
      - dependency-name: "actions/*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
